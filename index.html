<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoukExpress</title>
<style>
body { font-family: Arial; padding: 20px; background: #f4f4f4; max-width: 450px; margin: 0 auto; }
.box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
h2 { text-align: center; color: #333; }
input, select, textarea, button { width: 100%; padding: 12px; margin: 6px 0; font-size: 16px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
button { color: white; border: none; cursor: pointer; }
.green { background: #28a745; }
.blue { background: #007bff; }
.red { background: #dc3545; }
.orange { background: #fd7e14; }
.purple { background: #6f42c1; }
#msg { padding: 15px; border-radius: 5px; text-align: center; font-weight: bold; margin: 10px 0; }
.ok { background: #d4edda; color: green; }
.err { background: #f8d7da; color: red; }
.hidden { display: none; }
.store-item { background: #f8f9fa; padding: 12px; margin-bottom: 10px; border-radius: 8px; border-right: 4px solid #28a745; }
.store-item h3 { margin: 0 0 5px 0; color: #333; }
.store-item p { margin: 3px 0; font-size: 14px; color: #666; }
.product-item { background: #fff3cd; padding: 10px; margin: 5px 0; border-radius: 5px; border-right: 3px solid #fd7e14; font-size: 14px; }
.product-item b { color: #333; }
.section-title { font-weight: bold; margin: 15px 0 10px 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 5px; }
.small-btn { padding: 8px; font-size: 14px; margin-top: 5px; }
</style>
</head>
<body>

<!-- التسجيل -->
<div class="box" id="signup-box">
<h2>🚀 تسجيل حساب جديد</h2>
<input type="text" id="s-name" placeholder="الاسم الكامل">
<input type="tel" id="s-phone" placeholder="رقم الهاتف">
<input type="email" id="s-email" placeholder="البريد الإلكتروني">
<input type="password" id="s-pass" placeholder="كلمة السر (6+)">
<select id="s-role">
<option value="">اختر نوع الحساب...</option>
<option value="customer">زبون</option>
<option value="merchant">تاجر</option>
<option value="driver">موصل</option>
</select>
<button class="green" onclick="doSignup()">تسجيل</button>
</div>

<div id="msg" class="hidden"></div>

<!-- الدخول -->
<div class="box" id="login-box">
<h2>🔐 تسجيل الدخول</h2>
<input type="email" id="l-email" placeholder="البريد الإلكتروني">
<input type="password" id="l-pass" placeholder="كلمة السر">
<button class="blue" onclick="doLogin()">دخول</button>
</div>

<!-- لوحة التحكم -->
<div class="box hidden" id="dash-box" style="text-align:center;">
<h2>👋 مرحبا بك!</h2>
<p id="welcome" style="font-size: 18px;"></p>
<p>نوع الحساب: <b id="role"></b></p>
<button class="red" onclick="doLogout()">تسجيل الخروج</button>
</div>

<!-- زر إضافة متجر -->
<div class="box hidden" id="add-store-box">
<button class="orange" onclick="showStoreForm()">➕ إضافة متجر جديد</button>
</div>

<!-- فورم إضافة متجر -->
<div class="box hidden" id="store-form-box">
<h2>🏪 إضافة متجر جديد</h2>
<input type="text" id="st-name" placeholder="اسم المتجر">
<textarea id="st-desc" placeholder="وصف المتجر" rows="2"></textarea>
<input type="text" id="st-address" placeholder="العنوان">
<button class="green" onclick="doAddStore()">حفظ المتجر</button>
<button class="red" onclick="hideStoreForm()">إلغاء</button>
</div>

<!-- قائمة المتاجر -->
<div class="box hidden" id="stores-box">
<div class="section-title">🏪 قائمة المتاجر</div>
<div id="stores-list"></div>
</div>

<!-- فورم إضافة منتج -->
<div class="box hidden" id="product-form-box">
<h2>📦 إضافة منتج جديد</h2>
<p id="product-store-name" style="text-align:center; color:#666; font-size:14px;"></p>
<input type="text" id="pr-name" placeholder="اسم المنتج">
<textarea id="pr-desc" placeholder="وصف المنتج" rows="2"></textarea>
<input type="number" id="pr-price" placeholder="السعر (درهم)">
<input type="text" id="pr-image" placeholder="رابط الصورة (اختياري)">
<button class="purple" onclick="doAddProduct()">حفظ المنتج</button>
<button class="red" onclick="hideProductForm()">إلغاء</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supaURL = 'https://hzinjliwqixlsdqdvuma.supabase.co';
const supaKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6aW5qbGl3cWl4bHNkcWR2dW1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTE2NjAsImV4cCI6MjEwNzQ2NzY2MH0.575Tnk-RJOjJ7KhQdbxJOOKeDSBVxteBslZSoUDIyNs';
const DB = window.supabase.createClient(supaURL, supaKEY);
let currentUser = null;
let currentRole = null;
let currentStoreId = null;

function show(txt, ok) {
  const m = document.getElementById('msg');
  m.textContent = txt;
  m.className = ok ? 'ok' : 'err';
  m.classList.remove('hidden');
  setTimeout(() => m.classList.add('hidden'), 5000);
}

async function doSignup() {
  const email = document.getElementById('s-email').value;
  const pass = document.getElementById('s-pass').value;
  const name = document.getElementById('s-name').value;
  const phone = document.getElementById('s-phone').value;
  const role = document.getElementById('s-role').value;
  
  if (!email || !pass || !role) { show('املأ جميع الخانات', false); return; }
  
  show('⏳ جاري التسجيل...', true);
  try {
    const r = await DB.auth.signUp({ email: email, password: pass });
    if (r.error) throw r.error;
    
    if (r.data.user) {
      const { error: pErr } = await DB.from('profiles').upsert([{
        id: r.data.user.id,
        full_name: name,
        phone: phone,
        role: role
      }]);
      if (pErr) throw pErr;
    }
    
    show('✅ تم التسجيل! دابا دخل.', true);
  } catch (e) { 
    show('❌ ' + e.message, false); 
  }
}

async function doLogin() {
  const email = document.getElementById('l-email').value;
  const pass = document.getElementById('l-pass').value;
  
  if (!email || !pass) { show('املأ الإيميل وكلمة السر', false); return; }
  
  show('⏳ جاري الدخول...', true);
  try {
    const r = await DB.auth.signInWithPassword({ email: email, password: pass });
    if (r.error) throw r.error;
    
    currentUser = r.data.user;
    show('✅ مبروك! دخلت.', true);
    
    const p = await DB.from('profiles').select('*').eq('id', r.data.user.id).single();
    currentRole = p.data ? p.data.role : null;
    
    document.getElementById('signup-box').classList.add('hidden');
    document.getElementById('login-box').classList.add('hidden');
    document.getElementById('dash-box').classList.remove('hidden');
    document.getElementById('stores-box').classList.remove('hidden');
    
    document.getElementById('welcome').textContent = 'أهلاً ' + (p.data && p.data.full_name ? p.data.full_name : email);
    document.getElementById('role').textContent = currentRole || '-';
    
    if (currentRole === 'merchant') {
      document.getElementById('add-store-box').classList.remove('hidden');
    }
    
    loadStores();
  } catch (e) { 
    show('❌ ' + e.message, false); 
  }
}

async function doLogout() {
  await DB.auth.signOut();
  currentUser = null;
  currentRole = null;
  currentStoreId = null;
  ['dash-box','signup-box','login-box','add-store-box','store-form-box','stores-box','product-form-box'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
  document.getElementById('signup-box').classList.remove('hidden');
  document.getElementById('login-box').classList.remove('hidden');
  show('✅ تم الخروج', true);
}

function showStoreForm() {
  document.getElementById('store-form-box').classList.remove('hidden');
  document.getElementById('add-store-box').classList.add('hidden');
}

function hideStoreForm() {
  document.getElementById('store-form-box').classList.add('hidden');
  document.getElementById('add-store-box').classList.remove('hidden');
}

async function doAddStore() {
  const name = document.getElementById('st-name').value;
  const desc = document.getElementById('st-desc').value;
  const address = document.getElementById('st-address').value;
  
  if (!name) { show('اكتب اسم المتجر', false); return; }
  
  show('⏳ جاري حفظ المتجر...', true);
  try {
    const { error } = await DB.from('stores').insert([{
      owner_id: currentUser.id,
      name: name,
      description: desc,
      address: address
    }]);
    if (error) throw error;
    
    show('✅ تم إضافة المتجر بنجاح!', true);
    document.getElementById('st-name').value = '';
    document.getElementById('st-desc').value = '';
    document.getElementById('st-address').value = '';
    hideStoreForm();
    loadStores();
  } catch (e) { 
    show('❌ ' + e.message, false); 
  }
}

async function loadStores() {
  const list = document.getElementById('stores-list');
  list.innerHTML = '<p style="text-align:center;color:#888;">⏳ جاري التحميل...</p>';
  
  const { data: stores, error } = await DB.from('stores').select('*');
  
  if (error) {
    list.innerHTML = '<p style="text-align:center;color:red;">خطأ فتحميل المتاجر</p>';
    return;
  }
  
  if (!stores || stores.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:#888;">لا توجد متاجر حالياً</p>';
    return;
  }
  
  list.innerHTML = '';
  
  for (const s of stores) {
    const div = document.createElement('div');
    div.className = 'store-item';
    div.innerHTML = `
      <h3>🏪 ${s.name}</h3>
      <p>${s.description || 'لا يوجد وصف'}</p>
      <p>📍 ${s.address || 'العنوان غير محدد'}</p>
      <div id="prod-${s.id}">⏳ جاري تحميل المنتجات...</div>
    `;
    list.appendChild(div);
    
    // زر إضافة منتج (للتاجر فقط، للمتجر ديالو)
    if (currentRole === 'merchant' && s.owner_id === currentUser.id) {
      const addBtn = document.createElement('button');
      addBtn.className = 'purple small-btn';
      addBtn.textContent = '📦 إضافة منتج';
      addBtn.onclick = () => showProductForm(s.id, s.name);
      div.appendChild(addBtn);
    }
    
    loadProducts(s.id);
  }
}

async function loadProducts(storeId) {
  const container = document.getElementById('prod-' + storeId);
  if (!container) return;
  
  const { data: products, error } = await DB.from('products').select('*').eq('store_id', storeId);
  
  if (error || !products || products.length === 0) {
    container.innerHTML = '<p style="font-size:13px;color:#888;">لا توجد منتجات</p>';
    return;
  }
  
  container.innerHTML = '<b style="font-size:13px;">📦 المنتجات:</b>';
  products.forEach(pr => {
    const pDiv = document.createElement('div');
    pDiv.className = 'product-item';
    pDiv.innerHTML = `<b>${pr.name}</b> - ${pr.price} درهم<br><small>${pr.description || ''}</small>`;
    container.appendChild(pDiv);
  });
}

function showProductForm(storeId, storeName) {
  currentStoreId = storeId;
  document.getElementById('product-store-name').textContent = 'المتجر: ' + storeName;
  document.getElementById('product-form-box').classList.remove('hidden');
  document.getElementById('product-form-box').scrollIntoView({behavior: 'smooth'});
}

function hideProductForm() {
  document.getElementById('product-form-box').classList.add('hidden');
  currentStoreId = null;
}

async function doAddProduct() {
  const name = document.getElementById('pr-name').value;
  const desc = document.getElementById('pr-desc').value;
  const price = document.getElementById('pr-price').value;
  const image = document.getElementById('pr-image').value;
  
  if (!name || !price) { show('اكتب اسم المنتج والسعر', false); return; }
  
  show('⏳ جاري حفظ المنتج...', true);
  try {
    const { error } = await DB.from('products').insert([{
      store_id: currentStoreId,
      name: name,
      description: desc,
      price: parseFloat(price),
      image_url: image || null
    }]);
    if (error) throw error;
    
    show('✅ تم إضافة المنتج بنجاح!', true);
    document.getElementById('pr-name').value = '';
    document.getElementById('pr-desc').value = '';
    document.getElementById('pr-price').value = '';
    document.getElementById('pr-image').value = '';
    hideProductForm();
    loadProducts(currentStoreId);
  } catch (e) { 
    show('❌ ' + e.message, false); 
  }
}
</script>
</body>
</html>
