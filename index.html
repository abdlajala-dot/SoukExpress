<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="XXXXXXXXXXXXXXXXXXXX" />
<title>SoukExpress</title>
<meta name="description" content="SoukExpress - منصة التوصيل السريع بأكادير. اطلب من أفضل المتاجر، تتبع طلبك، واستفد من عروض حصرية.">
<meta name="theme-color" content="#FF6B00">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --primary: #FF6B00; --secondary: #00C853; --bg: #F8F9FA; --text: #2D2D2D; --muted: #888; --card: #FFF; --shadow: 0 4px 15px rgba(0,0,0,0.06); }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
body { background: var(--bg); color: var(--text); max-width: 500px; margin: 0 auto; padding-bottom: 80px; }

button { font-family: 'Tajawal', sans-serif; font-weight: 700; border-radius: 12px; border: none; padding: 14px; cursor: pointer; transition: 0.2s; width: 100%; font-size: 15px; margin-bottom: 10px;}
button:active { transform: scale(0.97); }
.green { background: var(--secondary); color: white; }
.blue { background: #2196F3; color: white; }
.red { background: #FF3D00; color: white; }
.orange { background: var(--primary); color: white; }
.purple { background: #9C27B0; color: white; }
.teal { background: #00BCD4; color: white; }
.pink { background: #FF4081; color: white; }
.whatsapp { background: #25D366; color: white; }
input, select, textarea { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #E0E0E0; background: #FFF; font-family: 'Tajawal', sans-serif; font-size: 15px; margin-bottom: 10px; }
input:focus { border-color: var(--primary); outline: none; }

.box { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
.hidden { display: none !important; }
h2 { font-size: 20px; margin-bottom: 15px; text-align: center; color: var(--primary); }

#msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border-radius: 30px; font-weight: bold; z-index: 99999; box-shadow: 0 10px 30px rgba(0,0,0,0.15); animation: slideDown 0.3s ease; }
#msg.ok { background: var(--secondary); color: white; }
#msg.err { background: #FF3D00; color: white; }
@keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }

.main-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: white; border-radius: 0 0 20px 20px; box-shadow: var(--shadow); margin-bottom: 15px; }
.user-info { display: flex; align-items: center; gap: 10px; }
.user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #FFF3EB; display: flex; align-items: center; justify-content: center; font-size: 20px;}
.greeting { display: block; font-weight: 800; font-size: 16px; }
.location { font-size: 12px; color: var(--muted); }
.notif-btn { background: transparent; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #eee; font-size: 18px; padding: 0; margin: 0;}
.search-container { position: relative; margin: 0 20px 20px 20px; }
.search-container input { padding-right: 40px; box-shadow: var(--shadow); border: none; margin: 0; }
.search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #999; }
.promo-banner-new { background: linear-gradient(135deg, #FF6B00, #FF8F00); border-radius: 20px; margin: 0 20px 20px 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white; position: relative; overflow: hidden; box-shadow: 0 8px 20px rgba(255,107,0,0.3); }
.promo-text h2 { font-size: 22px; margin: 0 0 10px 0; text-align: right; color: white; }
.promo-text p { font-size: 13px; margin: 0 0 15px 0; opacity: 0.9; }
.promo-btn { background: white; color: #FF6B00; width: auto; padding: 8px 20px; border-radius: 10px; }
.section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-bottom: 15px; }
.section-header h3 { margin: 0; font-size: 18px; font-weight: 800; }
.section-header a { color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 700; }

.stores-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 0 20px 20px 20px; }
.store-card { background: white; border-radius: 15px; padding: 15px; text-align: center; box-shadow: var(--shadow); cursor: pointer; transition: 0.2s;}
.store-card:active { transform: scale(0.97); }
.store-card img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px; }
.store-card h4 { margin: 0 0 5px 0; font-size: 15px; font-weight: 800; }
.store-card p { margin: 0; font-size: 12px; color: var(--muted); }

.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #FFFFFF; display: flex; justify-content: space-around; align-items: center; padding: 10px 0 15px 0; border-radius: 25px 25px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); z-index: 9999; }
.bottom-nav-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: 11px; font-weight: 700; gap: 4px; width: 25%; cursor: pointer; }
.bottom-nav-item.active { color: var(--primary); }
.nav-icon { font-size: 22px; }

.order-item { background: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; box-shadow: var(--shadow); font-size: 14px; border: 1px solid #f0f0f0;}
.order-products { background: #F8F9FA; padding: 10px; border-radius: 10px; margin: 10px 0; font-size: 13px; color: #555; }
.cart-item { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; }

.qr-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99997; display: flex; align-items: flex-end; justify-content: center; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
</head>
<body>
<div id="msg" class="hidden"></div>

<div class="box" id="stores-box" style="padding: 0; background: transparent; box-shadow: none;">
    <div class="main-header">
        <div class="user-info">
            <div class="user-avatar">👤</div>
            <div>
                <span class="greeting" id="welcome-text">مرحباً بك 👋</span>
                <span class="location">📍 أكادير</span>
            </div>
        </div>
        <button class="notif-btn" onclick="showNotifications()">🔔</button>
    </div>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="ابحث عن متجر أو منتج..." oninput="applyFilters()">
        <span class="search-icon">🔍</span>
    </div>

    <div class="promo-banner-new">
        <div class="promo-text">
            <h2>كل ما تحتاجه<br>يصل إليك بسرعة</h2>
            <p>من متجرك المفضل إلى باب منزلك</p>
            <button class="promo-btn" onclick="showScreen('stores-box', document.querySelectorAll('.bottom-nav-item')[0])">اطلب الآن ←</button>
        </div>
        <div style="font-size:80px; position:absolute; left:10px; bottom:-15px; opacity:0.2;">🛵</div>
    </div>

    <div class="section-header">
        <h3>🏪 المتاجر القريبة</h3>
        <a href="#" onclick="resetFilters()">عرض الكل ‹</a>
    </div>
    
    <div id="stores-list" class="stores-grid"></div>
</div>

<div class="box hidden" id="login-box">
<h2>🔐 تسجيل الدخول</h2>
<input type="email" id="l-email" placeholder="البريد الإلكتروني">
<input type="password" id="l-pass" placeholder="كلمة السر">
<button class="green" onclick="doLogin(event)">دخول</button>
<button class="blue" onclick="document.getElementById('login-box').classList.add('hidden');document.getElementById('signup-box').classList.remove('hidden')">حساب جديد</button>
</div>

<div class="box hidden" id="signup-box">
<h2>🚀 تسجيل حساب جديد</h2>
<input type="text" id="s-name" placeholder="الاسم الكامل">
<input type="tel" id="s-phone" placeholder="رقم الهاتف">
<input type="email" id="s-email" placeholder="البريد الإلكتروني">
<input type="password" id="s-pass" placeholder="كلمة السر (6+)">
<select id="s-role"><option value="customer">🛒 زبون</option><option value="merchant">🏪 تاجر</option><option value="driver">🚚 موصل</option></select>
<button class="green" onclick="doSignup(event)">تسجيل</button>
<button class="blue" onclick="document.getElementById('signup-box').classList.add('hidden');document.getElementById('login-box').classList.remove('hidden')">دخول</button>
</div>

<div class="box hidden" id="dash-box">
<h2>👋 مرحبا!</h2>
<p id="welcome" style="text-align:center; margin-bottom:15px; font-weight:bold;"></p>
<button class="orange" onclick="showStoreForm()" id="store-btn" style="display:none">➕ إضافة متجر جديد</button>
<button class="purple" onclick="showStats()" id="stats-btn" style="display:none">📊 الإحصائيات</button>
<button class="teal" onclick="showMyCoupons()" id="coupons-btn" style="display:none">🎟️ كودات الخصم</button>
<button class="red" onclick="doLogout()" style="margin-top:20px;">🚪 تسجيل الخروج</button>
</div>

<div class="box hidden" id="orders-box">
<h2>📋 الطلبات</h2>
<div id="orders-list"></div>
</div>

<div class="box hidden" id="cart-box">
<h2>🛒 السلة</h2>
<div id="cart-list"></div>
<div id="cart-total" class="cart-total hidden" style="background:var(--primary); color:white; padding:15px; border-radius:12px; text-align:center; margin:15px 0; font-weight:bold;"></div>
<div id="checkout-fields" class="hidden">
<input type="text" id="co-name" placeholder="الاسم">
<input type="tel" id="co-phone" placeholder="الهاتف">
<input type="text" id="co-address" placeholder="العنوان">
<button class="teal" onclick="doCheckout(event)">✅ تأكيد الطلب</button>
</div>
</div>

<div class="box hidden" id="profile-box">
<h2>👤 حسابي</h2>
<div id="profile-stats" style="text-align:center; margin-bottom:20px;"></div>
<button class="red" onclick="doLogout()">🚪 تسجيل الخروج</button>
</div>

<div id="store-modal" class="qr-modal hidden" onclick="if(event.target===this)this.classList.add('hidden')">
    <div style="background:white; border-radius:20px 20px 0 0; width:100%; max-width:500px; height:80vh; display:flex; flex-direction:column; overflow:hidden; animation: slideUp 0.3s ease;" onclick="event.stopPropagation()">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 20px; border-bottom:1px solid #eee;">
            <h3 id="modal-store-name" style="margin:0; color:var(--primary); font-size:18px;">اسم المتجر</h3>
            <button onclick="document.getElementById('store-modal').classList.add('hidden')" style="background:#FF3D00; color:white; width:32px; height:32px; border-radius:50%; font-weight:bold; border:none; font-size:16px; display:flex; align-items:center; justify-content:center; padding:0; margin:0;">✕</button>
        </div>
        <div id="modal-products-list" style="flex:1; overflow-y:auto; padding:15px; background:#F8F9FA;"></div>
    </div>
</div>

<div class="bottom-nav">
    <div class="bottom-nav-item active" onclick="showScreen('stores-box', this)">
        <span class="nav-icon">🏠</span><span>الرئيسية</span>
    </div>
    <div class="bottom-nav-item" onclick="showScreen('orders-box', this)">
        <span class="nav-icon">📦</span><span>الطلبات</span>
    </div>
    <div class="bottom-nav-item" onclick="showScreen('cart-box', this)">
        <span class="nav-icon">🛒</span><span>السلة</span>
    </div>
    <div class="bottom-nav-item" onclick="showScreen('profile-box', this)">
        <span class="nav-icon">👤</span><span>حسابي</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supaURL='https://hzinjliwqixlsdqdvuma.supabase.co';
const supaKEY='sb_publishable_7fcm9t-vqo3QosvH_jAYMQ_xCG3QtsZ';
const DB=window.supabase.createClient(supaURL,supaKEY);

let currentUser=null, currentRole=null, currentProfile=null;
let cart=[], allStoresCache={}, allProductsCache={};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function show(txt,ok){const m=document.getElementById('msg');m.textContent=txt;m.className=ok?'ok':'err';m.classList.remove('hidden');setTimeout(()=>m.classList.add('hidden'),4000);}
function setBtnLoading(btn,loading,txt){if(!btn)return;if(loading){btn.disabled=true;btn.dataset.orig=btn.textContent;btn.textContent='⏳...';}else{btn.disabled=false;btn.textContent=txt||btn.dataset.orig||'✅';}}

function showScreen(screenId, navEl) {
    document.querySelectorAll('.box').forEach(b => b.classList.add('hidden'));
    document.getElementById(screenId).classList.remove('hidden');
    document.querySelectorAll('.bottom-nav-item').forEach(el => el.classList.remove('active'));
    if(navEl) navEl.classList.add('active');
    
    if(screenId === 'orders-box') loadOrders();
    if(screenId === 'profile-box') showProfile();
    if(screenId === 'cart-box') loadCart();
}

async function doLogin(ev) {
    const btn=ev?ev.target:null;
    const e=document.getElementById('l-email').value, p=document.getElementById('l-pass').value;
    if(!e||!p){show('⚠️ ملء جميع الحقول',false);return;}
    setBtnLoading(btn,true);
    try{
        const r=await DB.auth.signInWithPassword({email:e,password:p});
        if(r.error)throw r.error;
        currentUser=r.data.user;
        const pp=await DB.from('profiles').select('*').eq('id',r.data.user.id).single();
        currentProfile=pp.data; currentRole=pp.data?.role;
        
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('signup-box').classList.add('hidden');
        
        if(currentRole === 'merchant'){
            document.getElementById('dash-box').classList.remove('hidden');
            document.getElementById('store-btn').style.display='block';
            document.getElementById('stats-btn').style.display='block';
            document.getElementById('coupons-btn').style.display='block';
            document.getElementById('welcome').textContent = 'أهلاً ' + (pp.data?.full_name || e);
        } else {
            document.getElementById('stores-box').classList.remove('hidden');
            document.getElementById('welcome-text').textContent = 'مرحباً، ' + (pp.data?.full_name || e);
        }
        
        loadStores();
        show('✅ تم الدخول بنجاح',true);
    }catch(err){show('❌ '+err.message,false);}
    finally{setBtnLoading(btn,false,'دخول');}
}

async function doSignup(ev){
    const btn=ev?ev.target:null;
    const e=document.getElementById('s-email').value, p=document.getElementById('s-pass').value, n=document.getElementById('s-name').value, ph=document.getElementById('s-phone').value, r=document.getElementById('s-role').value;
    if(!e||!p||!r){show('⚠️ ملء الحقول',false);return;}
    setBtnLoading(btn,true);
    try{
        const res=await DB.auth.signUp({email:e,password:p});
        if(res.error)throw res.error;
        if(res.data.user) await DB.from('profiles').upsert([{id:res.data.user.id,full_name:n,phone:ph,role:r}]);
        show('✅ تم التسجيل، يمكنك الدخول الآن',true);
        document.getElementById('signup-box').classList.add('hidden');
        document.getElementById('login-box').classList.remove('hidden');
    }catch(err){show('❌ '+err.message,false);}
    finally{setBtnLoading(btn,false,'تسجيل');}
}

async function doLogout(){
    await DB.auth.signOut();
    currentUser=null; currentRole=null;
    document.querySelectorAll('.box').forEach(b => b.classList.add('hidden'));
    document.getElementById('login-box').classList.remove('hidden');
}

async function loadStores(){
    const l=document.getElementById('stores-list');
    if(!l) return;
    l.innerHTML='<div style="text-align:center; grid-column:1/-1; padding:20px;">⏳ جاري التحميل...</div>';
    const{data:stores,error}=await DB.from('stores').select('*');
    if(error || !stores || stores.length===0){ l.innerHTML='<div style="text-align:center; grid-column:1/-1;">لا توجد متاجر</div>'; return; }
    
    allStoresCache={};
    for(const s of stores){
        allStoresCache[s.id]=s;
        const{data:p}=await DB.from('products').select('*').eq('store_id',s.id);
        allProductsCache[s.id]=p||[];
    }
    renderStores(stores);
}

function renderStores(stores){
  const l=document.getElementById('stores-list');
  l.innerHTML='';
  
  if(stores.length === 0){
    l.innerHTML = '<div style="text-align:center; padding:20px; color:#888; grid-column: 1/-1;">لا توجد متاجر حالياً</div>';
    return;
  }

  stores.forEach(s=>{
    const d=document.createElement('div');
    d.className='store-card';
    const imgUrl = s.image_url || 'https://cdn-icons-png.flaticon.com/512/869/869636.png'; 
    
    d.innerHTML = `
      <img src="${esc(imgUrl)}" alt="${esc(s.name)}">
      <h4>${esc(s.name)}</h4>
      <p style="color:#00C853;">● مفتوح</p>
      <div style="margin-top:8px; font-size:12px; font-weight:bold; color:#FF6B00;">⭐ 4.8</div>
    `;
    
    d.onclick = () => {
        openStoreModal(s.id, s.name);
    };
    
    l.appendChild(d);
  });
}

function applyFilters(){ loadStores(); }
function resetFilters(){ loadStores(); }

function openStoreModal(storeId, storeName) {
    document.getElementById('modal-store-name').textContent = storeName;
    const list = document.getElementById('modal-products-list');
    list.innerHTML = '⏳ جاري التحميل...';
    document.getElementById('store-modal').classList.remove('hidden');
    
    const products = allProductsCache[storeId] || [];
    
    if(products.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">لا توجد منتجات فـ هاد المتجر حالياً</div>';
        return;
    }
    
    list.innerHTML = '';
    products.forEach(pr => {
        const d = document.createElement('div');
        d.className = 'cart-item';
        d.style.flexDirection = 'column';
        d.style.alignItems = 'flex-start';
        d.style.padding = '15px';
        
        const img = pr.image_url ? `<img src="${esc(pr.image_url)}" style="width:60px; height:60px; border-radius:10px; object-fit:cover;">` : `<div style="width:60px; height:60px; border-radius:10px; background:#eee; display:flex; align-items:center; justify-content:center; font-size:24px;">📦</div>`;
        
        d.innerHTML = `
            <div style="display:flex; gap:15px; width:100%;">
                ${img}
                <div style="flex:1;">
                    <h4 style="margin:0 0 5px 0; font-size:15px; color:#333;">${esc(pr.name)}</h4>
                    <p style="margin:0; color:#888; font-size:12px;">${esc(pr.description||'')}</p>
                    <div style="margin-top:8px; font-weight:bold; color:var(--primary); font-size:16px;">${pr.price} DH</div>
                </div>
            </div>
            <button class="green" style="margin-top:10px; padding:8px; font-size:14px;" onclick="addToCart('${pr.id}', '${esc(pr.name).replace(/'/g, "\\'")}', ${pr.price}, '${storeId}')">➕ أضف للسلة</button>
        `;
        list.appendChild(d);
    });
}

function addToCart(pid,n,p,sid){
  if(cart.length>0 && cart[0].storeId!==sid){show('⚠️ لا يمكن الطلب من متجرين',false);return;}
  const ex=cart.find(c=>c.prodId===pid);
  if(ex) ex.qty+=1;
  else cart.push({prodId:pid, name:n, price:p, storeId:sid, qty:1});
  show('✅ تمت الإضافة', true);
  loadCart();
}

function loadCart(){
  const l=document.getElementById('cart-list');
  if(!l) return;
  if(cart.length===0){ l.innerHTML='<p style="text-align:center;color:#888">السلة فارغة</p>'; document.getElementById('checkout-fields').classList.add('hidden'); document.getElementById('cart-total').classList.add('hidden'); return; }
  l.innerHTML='';
  let total=0;
  cart.forEach((c,i)=>{
    total+=c.price*c.qty;
    const d=document.createElement('div'); d.className='cart-item';
    d.innerHTML=`<div><b>${esc(c.name)}</b> <br> <span style="color:#FF6B00">${c.price} DH</span> × ${c.qty}</div><button class="red" style="width:auto;padding:5px 10px;margin:0;" onclick="removeFromCart(${i})">❌</button>`;
    l.appendChild(d);
  });
  document.getElementById('cart-total').textContent = 'المجموع: ' + total + ' DH';
  document.getElementById('cart-total').classList.remove('hidden');
  document.getElementById('checkout-fields').classList.remove('hidden');
}

function removeFromCart(i){ cart.splice(i,1); loadCart(); }

async function doCheckout(ev){
  const btn=ev?ev.target:null;
  if(cart.length===0){show('⚠️ السلة فارغة',false);return;}
  const cn=document.getElementById('co-name').value, cp=document.getElementById('co-phone').value, ca=document.getElementById('co-address').value;
  if(!cn||!cp||!ca){show('⚠️ ملء معلومات التوصيل',false);return;}
  setBtnLoading(btn,true);
  
  const total=cart.reduce((s,c)=>s+c.price*c.qty,0);
  const sid=cart[0].storeId;
  
  try{
    const{data:od,error:oe}=await DB.from('orders').insert([{
      customer_id:currentUser.id, store_id:sid, status:'pending', total_price:total,
      delivery_address:ca, customer_phone:cp, customer_name:cn, payment_method:'cash'
    }]).select();
    
    if(oe) throw oe;
    const oid=od[0].id;
    const items=cart.map(c=>({order_id:oid, product_id:c.prodId, product_name:c.name, price:c.price, quantity:c.qty}));
    await DB.from('order_items').insert(items);
    
    show('🎉 تم إرسال طلبك بنجاح!',true);
    cart=[]; loadCart();
    document.querySelectorAll('.bottom-nav-item')[1].click(); 
  }catch(e){ show('❌ '+e.message,false); }
  finally{ setBtnLoading(btn,false,'✅ تأكيد الطلب'); }
}

async function loadOrders(){
    const l=document.getElementById('orders-list');
    if(!l) return;
    l.innerHTML='⏳';
    let q=DB.from('orders').select('*').order('created_at',{ascending:false});
    if(currentRole==='customer') q=q.eq('customer_id',currentUser.id);
    
    const{data:orders,error}=await q;
    if(error || !orders || orders.length===0){ l.innerHTML='<p style="text-align:center;color:#888">لا توجد طلبات</p>'; return; }
    
    l.innerHTML='';
    orders.forEach(o=>{
        const d=document.createElement('div');
        d.className='order-item';
        d.innerHTML=`
            <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
                <b style="color:var(--primary)">📦 #${o.id.substring(0,6)}</b>
                <span style="background:#FFF3EB;color:var(--primary);padding:2px 8px;border-radius:8px;font-size:12px;">${o.status}</span>
            </div>
            👤 ${esc(o.customer_name)}<br>
            📍 ${esc(o.delivery_address)}<br>
            <div style="margin-top:10px;font-weight:bold;color:var(--secondary)">💰 ${o.total_price} DH</div>
        `;
        l.appendChild(d);
    });
}

function showProfile() {
    const stats = document.getElementById('profile-stats');
    stats.innerHTML = `
        <div style="font-size:60px; margin-bottom:10px;">👤</div>
        <h3 style="margin-bottom:5px;">${esc(currentProfile?.full_name || 'مستخدم')}</h3>
        <p style="color:#888; font-size:14px;">${currentUser?.email || ''}</p>
        <p style="color:var(--primary); font-weight:bold; margin-top:10px;">${currentRole === 'customer' ? '🛒 زبون' : currentRole === 'merchant' ? '🏪 تاجر' : '🚚 موصل'}</p>
    `;
}

function showStoreForm(){ show('قريباً: إضافة متجر', true); }
function showStats(){ show('قريباً: الإحصائيات', true); }
function showMyCoupons(){ show('قريباً: كودات الخصم', true); }
function showNotifications(){ show('🔔 لا توجد إشعارات جديدة', true); }

window.addEventListener('DOMContentLoaded', () => {
    DB.auth.getSession().then(({data:{session}}) => {
        if(session) {
            currentUser = session.user;
            DB.from('profiles').select('*').eq('id', currentUser.id).single().then(({data}) => {
                currentProfile = data;
                currentRole = data?.role;
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('signup-box').classList.add('hidden');
                
                if(currentRole === 'merchant'){
                    document.getElementById('dash-box').classList.remove('hidden');
                    document.getElementById('store-btn').style.display='block';
                    document.getElementById('stats-btn').style.display='block';
                    document.getElementById('coupons-btn').style.display='block';
                    document.getElementById('welcome').textContent = 'أهلاً ' + (data?.full_name || session.user.email);
                } else {
                    document.getElementById('stores-box').classList.remove('hidden');
                    document.getElementById('welcome-text').textContent = 'مرحباً، ' + (data?.full_name || session.user.email);
                }
                loadStores();
            });
        } else {
            document.getElementById('login-box').classList.remove('hidden');
        }
    });
});
</script>
